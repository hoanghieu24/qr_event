    <title>EventGo.vn · Nền tảng Quản lý sự kiện & Check-in QR</title>
    <script>
      (function () {
        function enforceInlineVideo(el) {
          if (!el || el.tagName !== 'VIDEO') return el;
          try {
            el.defaultMuted = true;
            el.muted = true;
            el.playsInline = true;
            el.autoplay = true;
            el.controls = false;
            el.disablePictureInPicture = true;
            el.setAttribute('playsinline', 'true');
            el.setAttribute('webkit-playsinline', 'true');
            el.setAttribute('x5-playsinline', 'true');
            el.setAttribute('x5-video-player-type', 'h5-page');
            el.setAttribute('muted', 'true');
            el.setAttribute('autoplay', 'true');
          } catch (e) {}
          return el;
        }
        const origCreateElement = document.createElement;
        document.createElement = function (tagName, options) {
          const el = origCreateElement.call(document, tagName, options);
          if (typeof tagName === 'string' && tagName.toLowerCase() === 'video') {
            enforceInlineVideo(el);
          }
          return el;
        };
        if (typeof HTMLMediaElement !== 'undefined') {
          const origPlay = HTMLMediaElement.prototype.play;
          HTMLMediaElement.prototype.play = function () {
            enforceInlineVideo(this);
            return origPlay.apply(this, arguments);
          };
          const srcObjDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'srcObject');
          if (srcObjDesc && srcObjDesc.set) {
            Object.defineProperty(HTMLMediaElement.prototype, 'srcObject', {
              get: srcObjDesc.get,
              set: function (val) {
                enforceInlineVideo(this);
                return srcObjDesc.set.call(this, val);
              },
              configurable: true,
              enumerable: true,
            });
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
