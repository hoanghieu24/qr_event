name: Keep Render Backend Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render /health endpoint
        run: |
          TS=$(date -u +%s)
          echo "Pinging https://qr-event-ma84.onrender.com/health?t=${TS} at $(date -u)"
          curl -fsS --retry 2 --retry-delay 5 --max-time 65 -H "Cache-Control: no-store" "https://qr-event-ma84.onrender.com/health?t=${TS}"
          echo ""
