name: Keep Render Backend Awake

on:
  schedule:
    # Ping every 10 minutes (offset from :00 to reduce GitHub queue congestion)
    - cron: '3-53/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render /health endpoint
        run: |
          echo "Pinging https://qr-event-ma84.onrender.com/health at $(date -u)"
          curl -fsS --retry 2 --retry-delay 5 --max-time 65 https://qr-event-ma84.onrender.com/health
          echo ""
